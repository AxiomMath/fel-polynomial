# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "FelConjecture"
  authors: [Kenny Lau]
  description: >
    `FelConjecture` is a formal proof of Fel's conjecture on syzygies of numerical semigroups.
    For a numerical semigroup $S = \langle d_1, \dots, d_m \rangle \subseteq \mathbb{N}$ with
    $\gcd(d_1, \dots, d_m) = 1$ and gap set $\Delta = \mathbb{N} \setminus S$, it proves that for
    every $p \ge 0$,
    $K_p(S) = \sum_{r=0}^{p} \binom{p}{r} T_{p-r}(\sigma) G_r(S) + \frac{2^{p+1}}{p+1} T_{p+1}(\delta)$,
    where $G_r(S) = \sum_{g \in \Delta} g^r$ are the gap power sums, $K_p(S)$ is the normalized
    alternating power sum of the syzygy degrees appearing in the Hilbert numerator $Q_S$, and
    $T_n$ are Fel's universal symmetric polynomials. The Lean files were generated by AxiomProver,
    Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "Fel's Conjecture on Syzygies of Numerical Semigroups"
    authors: [Evan Chen, Chris Cummins, GSM, Dejan Grubisic, Leopold Haller, Letong Hong, Andranik Kurghinyan, Kenny Lau, Hugh Leather, Seewoo Lee, Aram Markosyan, Ken Ono, Manooshree Patel, Gaurang Pendharkar, Vedant Rathi, Alex Schneidman, Volker Seeker, Shubho Sengupta, Ishan Sinha, Jimmy Xin, Jujian Zhang]
    id: "https://arxiv.org/abs/2602.03716"
    type: "article"
    location: "Theorem 1.11 (= Conjecture 1.6)"
    relationship: "formalizes"
    note: >
      The paper's appendix documents this repository as the formalization of its main result.

classification:
  arxiv: [math.CO, math.AC, math.NT]
  msc2020: [20M14, 11P81]

status:
  scope: >
    Fel's conjecture for every numerical semigroup $S$, every generating set of $S$, and every
    $p \ge 0$. The Hilbert numerator $Q_S$ and the gap polynomial $\Phi_S$ are constructed
    explicitly in `problem.lean`.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
  - declaration: "NumericalSemigroup.semigroupGapDecomposition"
    file: "FelConjecture/solution.lean"
    sorry_count: 0
    axioms: [propext, Classical.choice, Quot.sound]
    comparator_config: "comparator.json"
  - declaration: "NumericalSemigroupGenerators.numeratorIdentity"
    file: "FelConjecture/solution.lean"
    sorry_count: 0
    axioms: [propext, Classical.choice, Quot.sound]
    comparator_config: "comparator.json"
  - declaration: "fels_conjecture"
    file: "FelConjecture/solution.lean"
    sorry_count: 0
    axioms: [propext, Classical.choice, Quot.sound]
    comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal problem statement in `FelConjecture/problem.lean` was checked against the source
    paper by an author of that paper.

alignment:
  statements:
    - source: "Definition 4.2 (gap polynomial): $\\Phi_S(z) = \\frac{1}{1-z} - H_S(z) = \\sum_{g \\in \\Delta} z^g$"
      lean: "NumericalSemigroup.semigroupGapDecomposition"
      module: "FelConjecture.solution"
      status: >
        Proved. The paper takes the two expressions for $\Phi_S$ as one definition; in Lean
        $\Phi_S$ is defined by the gap sum and the identity $H_S + \Phi_S = 1/(1-z)$ is a theorem.
    - source: "Definition 1.1 (Hilbert numerator): $H_S(z) = Q_S(z) / \\prod_{i=1}^m (1 - z^{d_i})$"
      lean: "NumericalSemigroupGenerators.numeratorIdentity"
      module: "FelConjecture.solution"
      status: >
        Proved. The paper quotes the rational form from Hilbert-Serre-Poincare; in Lean $Q_S$ is
        constructed coefficientwise and $H_S P_S = Q_S$ is a theorem.
    - source: "Theorem 1.11 (= Conjecture 1.6): $K_p(S) = \\sum_{r=0}^p \\binom{p}{r} T_{p-r}(\\sigma) G_r(S) + \\frac{2^{p+1}}{p+1} T_{p+1}(\\delta)$"
      lean: "fels_conjecture"
      module: "FelConjecture.solution"
      status: "Proved."
